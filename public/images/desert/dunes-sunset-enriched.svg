<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Desert sky gradient: warm amber sunset -->
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="35%" stop-color="#2d2847" />
      <stop offset="65%" stop-color="#6e3a47" />
      <stop offset="85%" stop-color="#ba5a43" />
      <stop offset="100%" stop-color="#f0965a" />
    </linearGradient>

    <!-- Warm horizon sun glow -->
    <radialGradient id="sunGlow" cx="65%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#fed590" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#e27e4e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#141a2e" stop-opacity="0" />
    </radialGradient>

    <!-- Far sand dunes gradient -->
    <linearGradient id="farDune" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a64d3b" />
      <stop offset="100%" stop-color="#5a242c" />
    </linearGradient>

    <!-- Mid sand dunes gradient -->
    <linearGradient id="midDune" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a2e2d" />
      <stop offset="100%" stop-color="#3c141d" />
    </linearGradient>

    <!-- Foreground dune gradient -->
    <linearGradient id="frontDune" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38131d" />
      <stop offset="100%" stop-color="#18070c" />
    </linearGradient>
  </defs>

  <!-- Sky & Glow -->
  <rect width="1600" height="900" fill="url(#sunsetSky)" />
  <rect width="1600" height="900" fill="url(#sunGlow)" />

  <!-- Thin delicate crescent moon in high twilight -->
  <path d="M420,180 A24,24 0 1,0 436,218 A21,21 0 1,1 420,180 Z" fill="#ffeec9" opacity="0.85" />

  <!-- Distant mountain ridges -->
  <path d="M0,620 Q300,590 600,610 T1200,580 Q1400,570 1600,610 L1600,900 L0,900 Z" fill="#4d1f2e" opacity="0.6" />

  <!-- Far sweeping sand dune -->
  <path d="M0,670 Q350,620 700,650 Q1050,680 1400,630 Q1500,620 1600,635 L1600,900 L0,900 Z" fill="url(#farDune)" />

  <!-- Mid-ground sweeping sand dune with gentle ridge curve -->
  <path d="M0,740 Q280,680 580,710 Q900,740 1200,690 Q1420,650 1600,695 L1600,900 L0,900 Z" fill="url(#midDune)" />

  <!-- Foreground high sand dune ridge -->
  <path d="M0,900 L0,790 Q220,740 480,780 Q800,820 1150,760 Q1400,720 1600,780 L1600,900 Z" fill="url(#frontDune)" />
</svg>
